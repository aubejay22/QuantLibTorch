name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-wheel:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SOURCE_DATE_EPOCH: '1793577600'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Pinned Boost headers
        shell: pwsh
        run: |
          Invoke-WebRequest https://archives.boost.io/release/1.82.0/source/boost_1_82_0.zip -OutFile build-boost.zip
          if ((Get-FileHash build-boost.zip -Algorithm SHA256).Hash.ToLower() -ne 'f7c9e28d242abcd7a2c1b962039fcdd463ca149d1883c3a950bbcc0ce6f7c6d9') { throw 'Boost checksum mismatch' }
          Expand-Archive -LiteralPath build-boost.zip -DestinationPath build/boost
      - run: python -m pip install torch==2.10.0+cu126 --index-url https://download.pytorch.org/whl/cu126
      - run: python -m pip install setuptools==72.1.0 wheel==0.45.1 build==1.2.2.post1 twine==6.1.0 pytest==8.3.4 QuantLib==1.40
      - run: python scripts/build.py --boost-include build/boost/boost_1_82_0
      - run: python -m pytest --junitxml=build/release-tests.xml
      - run: python -m build --wheel --no-isolation --outdir build/release
      - run: python -m twine check --strict build/release/*.whl
      - name: Execute educational examples from the installed candidate
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem build/release/*.whl).FullName
          python -m pip install --no-deps --no-index $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Wheel installation failed' }
          python -m pip install matplotlib==3.11.2 nbformat==5.11.1 nbclient==0.11.0 ipykernel==7.4.0
          if ($LASTEXITCODE -ne 0) { throw 'Tutorial dependency installation failed' }
          python scripts/validate_examples.py --scripts --report build/release-evidence/examples.json
          if ($LASTEXITCODE -ne 0) { throw 'Tutorial validation failed' }
      - name: Install and exercise wheel outside checkout
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem build/release/*.whl).FullName
          python scripts/validate_wheel.py $wheel --output build/release-evidence/clean_install.json
          if ($LASTEXITCODE -ne 0) { throw 'Independent installation failed' }
      - name: Bind the artifact to this clean Git revision
        run: python scripts/release_artifacts.py manifest build/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-wheel
          path: |
            build/release/*.whl
            build/release/manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-validation
          path: |
            build/release-tests.xml
            build/release-evidence/*.json
          retention-days: 30
