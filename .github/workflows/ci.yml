name: native-cpu

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-experiment:
    # Failure is evidence about Linux support; it must not block a validated
    # Windows release or cause an untested Ubuntu wheel to be published.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_DATE_EPOCH: '1793577600'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fetch the same pinned Boost headers as Windows
        run: |
          curl --fail --location --output boost.zip https://archives.boost.io/release/1.82.0/source/boost_1_82_0.zip
          echo 'f7c9e28d242abcd7a2c1b962039fcdd463ca149d1883c3a950bbcc0ce6f7c6d9  boost.zip' | sha256sum --check
          unzip -q boost.zip -d build/boost
      - run: python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install setuptools==72.1.0 wheel==0.45.1 build==1.2.2.post1 twine==6.1.0 pytest==8.3.4 QuantLib==1.40 auditwheel==6.4.2
      - name: Record toolchain
        run: |
          mkdir -p build/linux-evidence
          { python --version; c++ --version; cmake --version; ldd --version; python -m pip freeze; } > build/linux-evidence/toolchain.txt
      - name: Build native Linux package
        run: |
          set -o pipefail
          python scripts/build.py --boost-include build/boost/boost_1_82_0 --jobs 2 2>&1 | tee build/linux-evidence/build.log
      - run: python -m pytest --junitxml=build/linux-evidence/tests.xml
      - run: python -m build --wheel --no-isolation --outdir build/linux-wheel
      - run: python -m twine check --strict build/linux-wheel/*.whl
      - name: Inspect dependencies and symbol requirements without relabeling
        run: |
          set -o pipefail
          auditwheel show build/linux-wheel/*.whl 2>&1 | tee build/linux-evidence/auditwheel.txt
          readelf -d python/quantlibtorch/_native/quantlibtorch_native.so > build/linux-evidence/dynamic.txt
          ldd python/quantlibtorch/_native/quantlibtorch_native.so > build/linux-evidence/ldd.txt
      - name: Clean install on the build distribution only
        run: python scripts/validate_wheel.py build/linux-wheel/*.whl --torch-index https://download.pytorch.org/whl/cpu --output build/linux-evidence/clean_install.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-experiment-evidence
          path: build/linux-evidence/*
          if-no-files-found: warn
          retention-days: 30
